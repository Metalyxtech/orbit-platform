name: Deploy dev

# Merge to main: CDK deploy to orbit-dev and migrations on the Neon testing database.
# Amplify (orbit-dev-web) builds and deploys main by itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC -> orbit-dev-github-deploy (no stored AWS keys)
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_DEV }}
          aws-region: ap-southeast-1
      - name: Migrate Neon testing database
        run: |
          export DATABASE_OWNER_URL="$(aws ssm get-parameter --name /orbit/dev/ci/neonOwnerUrl --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$DATABASE_OWNER_URL"
          pnpm db:migrate
      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --all -c stage=dev --require-approval never
