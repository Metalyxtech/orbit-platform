name: Release to production

# Tag v* (e.g. v1.2.0): manual approval (GitHub environment "production"), CDK deploy to
# orbit-prod, migrations on Neon production, then fast-forward branch `production`, which
# the orbit-prod-web Amplify app builds.
on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # add required reviewers in Settings > Environments
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_PROD }}
          aws-region: ap-southeast-1
      - name: CDK deploy
        working-directory: infra
        run: npx cdk deploy --all -c stage=prod --require-approval never
      - name: Migrate Neon production
        run: |
          export DATABASE_OWNER_URL="$(aws ssm get-parameter --name /orbit/prod/ci/neonOwnerUrl --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$DATABASE_OWNER_URL"
          pnpm db:migrate
      - name: Fast-forward branch production
        run: |
          git push origin "${GITHUB_REF_NAME}^{commit}:refs/heads/production"
