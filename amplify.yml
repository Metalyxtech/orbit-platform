version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # The console has no Node 22 option; the build image ships nvm, so pick it here
            - nvm install 22 && nvm use 22
            - corepack enable && pnpm install --frozen-lockfile
        build:
          commands:
            # Next.js server code only sees variables written to .env.production
            - env | grep -e '^APP_' -e '^NEXT_PUBLIC_' -e '^HOSTING=' >> .env.production
            - pnpm --filter web build
      artifacts:
        baseDirectory: .next
        files: ['**/*']
      cache:
        paths: ['node_modules/**/*', '.next/cache/**/*']
